<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
        rel="stylesheet"
    >

    <title>Affichage dynamique - Choix de la journée</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /*
        ============================================================
        SÉLECTION DES JOURNÉES
        ============================================================
        */

        #daySelection {

            position: absolute;

            left: 5%;
            right: 5%;

            top: 20%;
            bottom: 18%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            z-index: 20;

        }


        /*
        ------------------------------------------------------------
        TITRE
        ------------------------------------------------------------
        */

        #daySelectionTitle {

            margin-bottom: 2vh;

            color: white;

            font-size: clamp(
                28px,
                3vw,
                60px
            );

            font-weight: 800;

            text-align: center;

        }


        #daySelectionSubtitle {

            margin-bottom: 3vh;

            color: white;

            font-size: clamp(
                16px,
                1.4vw,
                28px
            );

            opacity: 0.75;

            text-align: center;

        }


        /*
        ============================================================
        CONTENEUR DES BOUTONS
        ============================================================
        */

        #daysContainer {

            width: 100%;

            max-width: 1100px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        240px,
                        1fr
                    )
                );

            gap: 1.2vw;

            max-height: 55vh;

            overflow-y: auto;

            padding: 10px;

        }


        /*
        ============================================================
        BOUTON JOUR
        ============================================================
        */

        .dayButton {

            min-height: 130px;

            padding: 18px;

            border-radius: 18px;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.30
                );

            color: white;

            text-decoration: none;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

            font-family:
                "Baloo 2",
                sans-serif;

        }


        .dayButton:hover {

            transform:
                translateY(-5px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

        }


        /*
        ============================================================
        JOUR
        ============================================================
        */

        .dayWeekday {

            font-size: clamp(
                18px,
                1.5vw,
                30px
            );

            font-weight: 700;

            text-transform: uppercase;

            opacity: 0.75;

        }


        /*
        ============================================================
        DATE
        ============================================================
        */

        .dayDate {

            margin-top: 2px;

            font-size: clamp(
                25px,
                2vw,
                40px
            );

            font-weight: 800;

        }


        /*
        ============================================================
        NOMBRE D'ÉVÉNEMENTS
        ============================================================
        */

        .dayEvents {

            margin-top: 4px;

            font-size: clamp(
                14px,
                1vw,
                20px
            );

            opacity: 0.65;

        }


        /*
        ============================================================
        CHARGEMENT
        ============================================================
        */

        #loadingDays {

            color: white;

            font-size: 1.3vw;

            opacity: 0.7;

        }


        /*
        ============================================================
        AUCUN ÉVÉNEMENT
        ============================================================
        */

        #noDays {

            display: none;

            color: white;

            font-size: 1.5vw;

            opacity: 0.7;

        }


        /*
        ============================================================
        ERREUR
        ============================================================
        */

        #daysError {

            display: none;

            color: white;

            font-size: 1.2vw;

            opacity: 0.7;

        }


        /*
        ============================================================
        SCROLLBAR
        ============================================================
        */

        #daysContainer::-webkit-scrollbar {

            width: 6px;

        }


        #daysContainer::-webkit-scrollbar-track {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border-radius: 10px;

        }


        #daysContainer::-webkit-scrollbar-thumb {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            border-radius: 10px;

        }

    </style>

</head>


<body>

<div id="stage">

<div id="screen">

    <div id="bgOverlay"></div>

    <div id="content">


        <!-- ====================================================
             SÉLECTION DE LA JOURNÉE
             ==================================================== -->

        <div id="daySelection">

            <div id="daySelectionTitle">
                Choisissez une journée
            </div>

            <div id="daySelectionSubtitle">
                Sélectionnez la journée à afficher
            </div>


            <div id="loadingDays">
                Chargement des événements...
            </div>


            <div id="daysContainer"></div>


            <div id="noDays">
                Aucun événement à venir.
            </div>


            <div id="daysError">
                Impossible de charger les événements.
            </div>

        </div>


    </div>


    <!-- ========================================================
         BAS DE L'ÉCRAN
         ======================================================== -->

    <div id="bottomZone">

        <div id="statusRibbon">
            <span id="statusText"></span>
        </div>

    </div>


</div>

</div>


<script>

    /*
    ============================================================
    CONFIGURATION
    ============================================================
    */

    const EVENTS_URL =
        "events.json";


    /*
    ============================================================
    OUTILS
    ============================================================
    */

    function getDateKey(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${year}-${month}-${day}`;

    }


    /*
    ============================================================
    FIN D'UN ÉVÉNEMENT
    ============================================================
    */

    function isEventFinished(event) {

        if (!event.end) {

            return false;

        }


        const end =
            new Date(
                event.end
            );


        return (
            end.getTime()
            <=
            Date.now()
        );

    }


    /*
    ============================================================
    FORMAT JOUR
    ============================================================
    */

    function formatWeekday(date) {

        return date
            .toLocaleDateString(
                "fr-FR",
                {
                    weekday:
                        "long"
                }
            );

    }


    /*
    ============================================================
    FORMAT DATE
    ============================================================
    */

    function formatDate(date) {

        return date
            .toLocaleDateString(
                "fr-FR",
                {
                    day:
                        "numeric",

                    month:
                        "long"
                }
            );

    }


    /*
    ============================================================
    CHARGEMENT DES ÉVÉNEMENTS
    ============================================================
    */

    async function loadDays() {

        const loading =
            document.getElementById(
                "loadingDays"
            );


        const container =
            document.getElementById(
                "daysContainer"
            );


        const noDays =
            document.getElementById(
                "noDays"
            );


        const error =
            document.getElementById(
                "daysError"
            );


        try {

            const response =
                await fetch(
                    EVENTS_URL
                    +
                    "?t="
                    +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Impossible de charger events.json"
                );

            }


            const data =
                await response.json();


            const events =
                data.events || [];


            /*
            ====================================================
            GROUPEMENT PAR JOUR
            ====================================================
            */

            const days =
                new Map();


            events.forEach(
                event => {

                    if (!event.start) {

                        return;

                    }


                    /*
                    Ignorer les événements terminés
                    */

                    if (
                        isEventFinished(
                            event
                        )
                    ) {

                        return;

                    }


                    const start =
                        new Date(
                            event.start
                        );


                    const key =
                        getDateKey(
                            start
                        );


                    if (!days.has(key)) {

                        days.set(
                            key,
                            {
                                date:
                                    start,

                                events:
                                    []
                            }
                        );

                    }


                    days
                        .get(key)
                        .events
                        .push(
                            event
                        );

                }
            );


            /*
            ====================================================
            TRI
            ====================================================
            */

            const sortedDays =
                Array.from(
                    days.values()
                )
                .sort(
                    (a, b) =>
                        a.date.getTime()
                        -
                        b.date.getTime()
                );


            loading.style.display =
                "none";


            /*
            ====================================================
            AUCUNE JOURNÉE
            ====================================================
            */

            if (
                sortedDays.length === 0
            ) {

                noDays.style.display =
                    "block";

                return;

            }


            /*
            ====================================================
            CRÉATION DES BOUTONS
            ====================================================
            */

            sortedDays.forEach(
                day => {

                    const key =
                        getDateKey(
                            day.date
                        );


                    const button =
                        document.createElement(
                            "a"
                        );


                    button.className =
                        "dayButton";


                    button.href =
                        "prochain-jour.html?date="
                        +
                        encodeURIComponent(
                            key
                        );


                    const weekday =
                        formatWeekday(
                            day.date
                        );


                    const date =
                        formatDate(
                            day.date
                        );


                    const count =
                        day.events.length;


                    const eventLabel =
                        count === 1
                        ?
                        "1 événement"
                        :
                        `${count} événements`;


                    button.innerHTML = `

                        <div class="dayWeekday">
                            ${weekday}
                        </div>

                        <div class="dayDate">
                            ${date}
                        </div>

                        <div class="dayEvents">
                            ${eventLabel}
                        </div>

                    `;


                    container.appendChild(
                        button
                    );

                }
            );

        }
        catch (errorObject) {

            console.error(
                errorObject
            );


            loading.style.display =
                "none";


            error.style.display =
                "block";

        }

    }


    /*
    ============================================================
    INITIALISATION
    ============================================================
    */

    loadDays();

</script>


</body>

</html>
