<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
        rel="stylesheet"
    >


    <title>
        Affichage dynamique
    </title>


    <link
        rel="stylesheet"
        href="jour.css"
    >

</head>


<body>

<div id="screen">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div id="header">

        <img
            id="associationLogo"
            src="img/logo-etabli.svg"
            alt="L'Établi Ludique"
        >


        <div id="headerText">

            <div id="pageTitle">
                Événements
            </div>


            <div id="pageDate"></div>

        </div>

    </div>


    <!-- =====================================================
         GRILLE DES ÉVÉNEMENTS
         ===================================================== -->

    <div id="eventGrid"></div>


    <!-- =====================================================
         AUCUN ÉVÉNEMENT
         ===================================================== -->

    <div id="noEvent">

        Aucun événement pour cette journée.

    </div>


    <!-- =====================================================
         INDICATEUR PAGINATION
         ===================================================== -->

    <div id="pageIndicator"></div>


</div>


<script>

    /*
    ============================================================
    CONFIGURATION
    ============================================================
    */

    const DATA_URL =
        "events.json";

    const OVERRIDES_URL =
        "status-overrides.json";


    /*
    ============================================================
    VARIABLES
    ============================================================
    */

    let allEvents = [];

    let overrides = {};


    /*
    ============================================================
    STATUTS
    ============================================================
    */

    const STATUS_COLORS = {

        "annulé":
            "#c0392b",

        "annule":
            "#c0392b",

        "complet":
            "#e08e0b",

        "reporté":
            "#6c5ce7",

        "reporte":
            "#6c5ce7"

    };


    /*
    ============================================================
    JOURS
    ============================================================
    */

    const shortWeekdays = [

        "DIM",
        "LUN",
        "MAR",
        "MER",
        "JEU",
        "VEN",
        "SAM"

    ];


    /*
    ============================================================
    DATE LOCALE
    ============================================================
    */

    function dateOnly(date) {

        return new Date(

            date.getFullYear(),

            date.getMonth(),

            date.getDate()

        );

    }


    /*
    ============================================================
    CLÉ YYYY-MM-DD
    ============================================================
    */

    function dateKey(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${year}-${month}-${day}`;

    }


    /*
    ============================================================
    DATE DEMANDÉE
    ============================================================
    */

    function getRequestedDate() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requested =
            params.get(
                "date"
            );


        /*
        Pas de paramètre :
        on cherche le prochain jour.
        */

        if (!requested) {

            return null;

        }


        /*
        Vérification du format.
        */

        if (
            !/^\d{4}-\d{2}-\d{2}$/
                .test(requested)
        ) {

            return null;

        }


        const parts =
            requested.split(
                "-"
            );


        const date =
            new Date(

                Number(parts[0]),

                Number(parts[1]) - 1,

                Number(parts[2])

            );


        /*
        Vérifier que la date est valide.
        */

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return null;

        }


        return dateOnly(
            date
        );

    }


    /*
    ============================================================
    ÉVÉNEMENT TERMINÉ
    ============================================================
    */

    function isFinished(event) {

        if (!event.end) {

            return false;

        }


        const end =
            new Date(
                event.end
            );


        return (
            end.getTime()
            <=
            Date.now()
        );

    }


    /*
    ============================================================
    PROCHAIN JOUR DISPONIBLE
    ============================================================
    */

    function findNextEventDay() {

        const today =
            dateOnly(
                new Date()
            );


        const futureEvents =
            allEvents

                .filter(
                    event =>
                        event.start &&
                        !isFinished(event)
                )

                .filter(
                    event =>
                        dateOnly(
                            new Date(
                                event.start
                            )
                        ).getTime()
                        >
                        today.getTime()
                );


        if (
            !futureEvents.length
        ) {

            return null;

        }


        const dates =
            futureEvents

                .map(
                    event =>
                        dateOnly(
                            new Date(
                                event.start
                            )
                        )
                )

                .sort(
                    (a, b) =>
                        a.getTime()
                        -
                        b.getTime()
                );


        return dates[0];

    }


    /*
    ============================================================
    FORMATER HEURE
    ============================================================
    */

    function formatHour(date) {

        const h =
            date.getHours();


        const m =
            date.getMinutes();


        return m === 0

            ? `${h}h`

            : `${h}h${String(m).padStart(2, "0")}`;

    }


    /*
    ============================================================
    CRÉATION D'UNE CARTE
    ============================================================
    */

    function renderCard(event) {

        const start =
            new Date(
                event.start
            );


        const end =
            event.end
            ?
            new Date(
                event.end
            )
            :
            null;


        const statut =
            (
                overrides[event.uid] &&
                overrides[event.uid].statut
            )
            ||
            (
                event.campaign &&
                event.campaign.statut
            )
            ||
            "";


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "eventCard";


        /*
        --------------------------------------------------------
        BADGE
        --------------------------------------------------------
        */

        const normalizedStatus =
            statut
                .trim()
                .toLowerCase();


        const badgeHtml =
            statut
            ?
            `

                <div
                    class="statusBadge"
                    style="
                        background:
                        ${
                            STATUS_COLORS[
                                normalizedStatus
                            ]
                            ||
                            "#c0392b"
                        }
                    "
                >
                    ${statut}
                </div>

            `
            :
            "";


        /*
        --------------------------------------------------------
        IMAGE
        --------------------------------------------------------
        */

        const thumbHtml =
            (
                event.campaign &&
                event.campaign.image
            )
            ?

            `

                <div class="thumb">

                    <img
                        src="${event.campaign.image}"
                        alt=""
                    >

                </div>

            `

            :

            "";


        /*
        --------------------------------------------------------
        FIN
        --------------------------------------------------------
        */

        const endHtml =
            end
            ?

            `
                ${formatHour(end)}
            `

            :

            "";


        /*
        --------------------------------------------------------
        CONTENU
        --------------------------------------------------------
        */

        card.innerHTML = `

            <div class="date">

                <div class="weekday">
                    ${shortWeekdays[start.getDay()]}
                </div>

                <div class="day">
                    ${start.getDate()}
                </div>

            </div>


            ${thumbHtml}


            <div class="infoBlock">

                <div class="textCol">

                    <div class="title">
                        ${event.title}
                    </div>


                    <div class="meta">

                        <svg
                            viewBox="0 0 24 24"
                            class="icon"
                        >

                            <circle
                                cx="12"
                                cy="12"
                                r="9"
                                fill="none"
                                stroke="#3a4160"
                                stroke-width="2"
                            />

                            <path
                                d="M12 7v5l3.5 2"
                                fill="none"
                                stroke="#3a4160"
                                stroke-width="2"
                                stroke-linecap="round"
                            />

                        </svg>


                        <span>

                            ${formatHour(start)}

                            ${
                                endHtml
                                ?
                                ` – ${endHtml}`
                                :
                                ""
                            }

                        </span>


                        ${
                            event.location

                            ?

                            `

                                <svg
                                    viewBox="0 0 24 24"
                                    class="icon"
                                >

                                    <path
                                        d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z"
                                        fill="#e6392b"
                                    />

                                    <circle
                                        cx="12"
                                        cy="10"
                                        r="3"
                                        fill="white"
                                    />

                                </svg>


                                <span>
                                    ${event.location}
                                </span>

                            `

                            :

                            ""

                        }

                    </div>

                </div>


                ${badgeHtml}

            </div>

        `;


        return card;

    }


    /*
    ============================================================
    ÉVÉNEMENTS D'UNE DATE
    ============================================================
    */

    function getEventsForDate(date) {

        if (!date) {

            return [];

        }


        const wanted =
            date.getTime();


        return allEvents

            .filter(
                event =>
                    event.start
            )

            .filter(
                event => {

                    const start =
                        new Date(
                            event.start
                        );


                    return (
                        dateOnly(
                            start
                        ).getTime()
                        ===
                        wanted
                    );

                }
            )

            .filter(
                event =>
                    !isFinished(event)
            )

            .sort(
                (a, b) =>
                    new Date(a.start)
                    -
                    new Date(b.start)
            );

    }


    /*
    ============================================================
    AFFICHAGE
    ============================================================
    */

    function renderEvents() {

        const grid =
            document.getElementById(
                "eventGrid"
            );


        const noEvent =
            document.getElementById(
                "noEvent"
            );


        /*
        --------------------------------------------------------
        DATE DEMANDÉE
        --------------------------------------------------------
        */

        let selectedDate =
            getRequestedDate();


        /*
        --------------------------------------------------------
        SI AUCUNE DATE :
        PROCHAIN JOUR
        --------------------------------------------------------
        */

        if (!selectedDate) {

            selectedDate =
                findNextEventDay();

        }


        /*
        --------------------------------------------------------
        AUCUNE DATE DISPONIBLE
        --------------------------------------------------------
        */

        if (!selectedDate) {

            grid.innerHTML =
                "";

            noEvent.style.display =
                "block";

            document.body.classList.add(
                "empty"
            );

            document.getElementById(
                "pageDate"
            ).textContent =
                "";

            return;

        }


        /*
        --------------------------------------------------------
        ÉVÉNEMENTS
        --------------------------------------------------------
        */

        const events =
            getEventsForDate(
                selectedDate
            );


        /*
        --------------------------------------------------------
        AUCUN ÉVÉNEMENT
        --------------------------------------------------------
        */

        if (!events.length) {

            grid.innerHTML =
                "";

            noEvent.style.display =
                "block";

            document.body.classList.add(
                "empty"
            );

            document.getElementById(
                "pageDate"
            ).textContent =
                selectedDate.toLocaleDateString(
                    "fr-FR",
                    {
                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );

            return;

        }


        /*
        --------------------------------------------------------
        AFFICHAGE NORMAL
        --------------------------------------------------------
        */

        noEvent.style.display =
            "none";


        document.body.classList.remove(
            "empty"
        );


        document.getElementById(
            "pageDate"
        ).textContent =
            selectedDate.toLocaleDateString(
                "fr-FR",
                {
                    weekday:
                        "long",

                    day:
                        "2-digit",

                    month:
                        "long",

                    year:
                        "numeric"
                }
            );


        /*
        IMPORTANT :
        On affiche TOUS les événements.

        pagination.js se charge ensuite
        de limiter à 6 par page.
        */

        grid.innerHTML =
            "";


        events.forEach(
            event => {

                grid.appendChild(
                    renderCard(event)
                );

            }
        );

    }


    /*
    ============================================================
    CHARGEMENT DES DONNÉES
    ============================================================
    */

    async function loadEvents() {

        try {

            const response =
                await fetch(
                    DATA_URL +
                    "?t=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Impossible de charger events.json"
                );

            }


            const json =
                await response.json();


            allEvents =
                json.events || [];


            /*
            ----------------------------------------------------
            OVERRIDES
            ----------------------------------------------------
            */

            try {

                const overrideResponse =
                    await fetch(
                        OVERRIDES_URL +
                        "?t=" +
                        Date.now()
                    );


                if (
                    overrideResponse.ok
                ) {

                    overrides =
                        await overrideResponse.json();

                }
                else {

                    overrides = {};

                }

            }
            catch (error) {

                overrides = {};

            }


            /*
            ----------------------------------------------------
            AFFICHER
            ----------------------------------------------------
            */

            renderEvents();

        }
        catch (error) {

            console.error(
                "Erreur de chargement :",
                error
            );

            document.getElementById(
                "eventGrid"
            ).innerHTML =
                "";

            document.getElementById(
                "noEvent"
            ).style.display =
                "block";

        }

    }


    /*
    ============================================================
    RAFRAÎCHISSEMENT
    ============================================================
    */

    loadEvents();


    /*
    Les données sont régénérées
    régulièrement par ton système.

    On recharge donc events.json
    toutes les 60 secondes.
    */

    setInterval(
        loadEvents,
        60 * 1000
    );


</script>


<!-- =========================================================
     PAGINATION COMMUNE

     6 événements / page
     changement automatique
     flèches latérales
     capture d'écran
     ========================================================= -->

<script
    src="pagination.js"
></script>


</body>

</html>
